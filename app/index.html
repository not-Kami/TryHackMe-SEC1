<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisions — Quiz</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <div id="app"></div>
    <footer class="bottom-bar">
      <div class="bottom-bar-left">
        <a href="about.html" class="bottom-bar-icon" title="About me" aria-label="About me">
          <img src="/src/img/profile/images.jpg" alt="" class="bottom-bar-pp-img" />
        </a>
      </div>
      <a href="https://buymeacoffee.com/nachofuerte" target="_blank" rel="noopener noreferrer" class="bottom-bar-link bottom-bar-bmc">☕ Buy Me a Coffee</a>
      <div class="bottom-bar-gear-wrap">
        <a
          href="#"
          class="bottom-bar-gear"
          id="reset-progress-gear"
          title="Reset progress"
          aria-label="Reset progress"
        >
          ⚙
        </a>
        <div class="reset-progress-menu" id="reset-progress-menu" hidden>
          <a
            href="#"
            class="reset-progress-menu-item"
            id="reset-progress-action"
            aria-label="Reset quiz progress"
          >
            Reset progress
          </a>
          <a
            href="#"
            class="reset-progress-menu-item"
            id="my-stats-action"
            aria-label="My stats"
          >
            My stats
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
